name: Docker Build Validation

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "infrastructure/docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-docker:
    name: Docker Configuration & Image Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build Web Frontend Image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          tags: redvelvet-web:validation-test

      - name: Build API Backend Image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: redvelvet-api:validation-test
