name: Security Scanning

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: infrastructure/security/gitleaks.toml

  dependency-and-sast:
    name: Dependency Audit & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Security Audit Tools
        run: |
          pip install pip-audit bandit

      - name: Python Dependency Vulnerability Audit
        run: |
          pip-audit -r apps/api/requirements.txt || true

      - name: Bandit Static Application Security Testing (SAST)
        run: |
          bandit -r apps/api/app -ll -ii

      - name: Node Dependency Audit
        run: |
          npm audit --audit-level=high || true
