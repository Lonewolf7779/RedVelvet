apiVersion: apps/v1
kind: Deployment
metadata:
  name: redvelvet-api
  labels:
    app.kubernetes.io/name: redvelvet-api
    app.kubernetes.io/part-of: red-velvet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redvelvet-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redvelvet-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: redvelvet-api:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redvelvet-api-svc
spec:
  selector:
    app.kubernetes.io/name: redvelvet-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
