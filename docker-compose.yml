services:
  postgres:
    image: postgres:16-alpine
    container_name: redvelvet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redvelvet}
      POSTGRES_USER: ${POSTGRES_USER:-redvelvet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redvelvet_local_dev_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-redvelvet_user} -d ${POSTGRES_DB:-redvelvet}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: redvelvet-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redvelvet_redis_local_pwd}",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-redvelvet_redis_local_pwd}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: redvelvet-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      PROJECT_NAME: "Project Red Velvet API"
      API_V1_STR: "/api/v1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-redvelvet_user}:${POSTGRES_PASSWORD:-redvelvet_local_dev_pwd}@postgres:5432/${POSTGRES_DB:-redvelvet}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redvelvet_redis_local_pwd}@redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      LOG_LEVEL: INFO
      MAX_REQUEST_SIZE_BYTES: 10485760
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: redvelvet-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
